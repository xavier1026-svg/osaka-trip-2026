<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Osaka 2026 Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ind: {
                orange: '#FF5200', // Bright Industrial Orange
                black: '#121212', // Deep Black
                gray: '#E5E5E5',  // Industrial Gray
                white: '#FFFFFF',
              }
            },
            fontFamily: {
              sans: ['Inter', 'Helvetica Neue', 'Arial', 'sans-serif'],
              mono: ['JetBrains Mono', 'Courier New', 'monospace'],
            },
            boxShadow: {
              'hard': '4px 4px 0px 0px #121212',
              'hard-sm': '2px 2px 0px 0px #121212',
              'hard-lg': '6px 6px 0px 0px #121212',
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        background-color: #E5E5E5;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Industrial Utilities */
      .border-ind {
        border: 2px solid #121212;
      }
      .btn-press:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px 0px #121212;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
