<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Osaka 2026">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8201/8201880.png"> 

    <title>Osaka 2026 Planner</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ind: {
                orange: '#FF5200', // Bright Industrial Orange
                black: '#121212', // Deep Black
                gray: '#E5E5E5',  // Industrial Gray
                white: '#FFFFFF',
              }
            },
            fontFamily: {
              sans: ['Inter', 'Helvetica Neue', 'Arial', 'sans-serif'],
              mono: ['JetBrains Mono', 'Courier New', 'monospace'],
            },
            boxShadow: {
              'hard': '4px 4px 0px 0px #121212',
              'hard-sm': '2px 2px 0px 0px #121212',
              'hard-lg': '6px 6px 0px 0px #121212',
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        background-color: #E5E5E5;
        overscroll-behavior-y: none; /* 防止 iOS 橡皮筋迴彈效果 */
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Industrial Utilities */
      .border-ind {
        border: 2px solid #121212;
      }
      .btn-press:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px 0px #121212;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <!-- 指向 src 資料夾 -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
